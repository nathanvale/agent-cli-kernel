name: Token claims
on: pull_request
jobs:
  claims:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA head=$HEAD_SHA base=$BASE_SHA"
          curl -sSf --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claims-probe" | jq -r .value | python3 -c 'import sys,json,base64; p=sys.stdin.read().split(".")[1]; p+="="*(-len(p)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(p)),indent=1))'
