name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: File size
        run: bun run check:file-size
      - name: Lint
        run: bun run lint
      - name: Format
        if: ${{ !cancelled() }}
        run: bun run format:check
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck
      - if: github.event_name == 'pull_request'
        run: bun run --silent quality:fallow --base "origin/${{ github.base_ref }}"
      - if: github.event_name == 'push'
        run: bun run --silent quality:fallow --base "${{ github.event.before }}"
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Test
        run: bun run test --shard=${{ matrix.shard }}/3 --timings=tests/test-timings.json --update-timings
      - name: Upload shard timings
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: tests/test-timings.json
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - id: verdict
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
          CHECKER: ${{ hashFiles('.github/workflows/ci.yml', 'scripts/**', 'package.json', 'bun.lock', 'repository.json') }}
        run: echo "key=commits-verdict-$NUMBER-$BASE_REF-$CHECKER" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/verdict
          key: ${{ steps.verdict.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.verdict.outputs.key }}-
      - id: check
        env:
          BASE: origin/${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICT: ${{ runner.temp }}/verdict
        run: |
          green=$(cat "$VERDICT" 2>/dev/null || true)
          if [[ ! $green =~ ^[0-9a-f]{40}$ || $green == "$HEAD_SHA" ]]; then
            green=""
          else
            echo "Carried forward: ${green:0:7}, the last all-GREEN head of this pull request."
          fi
          CHECK_COMMITS_SINCE="$green" bun run check:commits "$BASE"
          echo "$HEAD_SHA" > "$VERDICT"
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/verdict
          key: ${{ steps.verdict.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
  fault-replay-shard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bun run fault-replay --shard ${{ matrix.shard }}/4 --tooling-changed-since "$BASE"
  fault-replay:
    if: always() && github.event_name == 'pull_request'
    needs: fault-replay-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHARDS: ${{ needs.fault-replay-shard.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "The fault-replay-shard jobs ended $SHARDS. Repair: open the red fault-replay-shard job and follow its Repair line." >&2
            exit 1
          fi
          echo "All four fault-replay-shard jobs passed."
