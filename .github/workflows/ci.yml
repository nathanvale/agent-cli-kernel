name: Hosted check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: File size
        run: bun run check:file-size
      - name: Recorded lists
        if: github.event_name == 'pull_request'
        run: bun run check:names --against "origin/${{ github.base_ref }}"
      - name: Lint
        run: bun run lint
      - name: Format
        if: ${{ !cancelled() }}
        run: bun run format:check
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck
      - if: github.event_name == 'pull_request'
        run: bun run --silent quality:fallow --base "origin/${{ github.base_ref }}" --fail-on-baseline-growth
      - if: github.event_name == 'push'
        run: bun run --silent quality:fallow --base "${{ github.event.before }}" --fail-on-baseline-growth
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Test
        env:
          TEST_SHARD: ${{ matrix.shard }}/3
        run: bun run test --shard="$TEST_SHARD" --timings=tests/test-timings.json --update-timings
      - name: Upload shard timings
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: tests/test-timings.json
  commits-cache:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      token-hex: ${{ steps.token.outputs.token-hex }}
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/verdict-token
          key: commits-verdict-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: commits-verdict-
      - id: token
        run: |
          token=$(head -c 8192 "$RUNNER_TEMP/verdict-token" 2>/dev/null || true)
          if [[ $token =~ ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$ ]]; then
            echo "token-hex=$(printf '%s' "$token" | od -An -v -tx1 | tr -d ' \n')" >> "$GITHUB_OUTPUT"
          fi
  commits-carry:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: commits-cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      since: ${{ steps.carry.outputs.since }}
      base: ${{ steps.carry.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - id: carry
        env:
          CARRIED_TOKEN_HEX: ${{ needs.commits-cache.outputs.token-hex }}
        run: bun --no-install scripts/carried-verdict.ts
  commits-shard:
    if: github.event_name == 'pull_request'
    needs: commits-carry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun install --frozen-lockfile
      - env:
          BASE: ${{ needs.commits-carry.outputs.base }}
          CHECK_COMMITS_SINCE: ${{ needs.commits-carry.outputs.since }}
        run: bun run check:commits "$BASE" --shard ${{ matrix.shard }}/4
  commits:
    if: always() && github.event_name == 'pull_request'
    needs: [commits-carry, commits-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          CARRY: ${{ needs.commits-carry.result }}
          SHARDS: ${{ needs.commits-shard.result }}
        run: |
          if [ "$CARRY" != success ] || [ "$SHARDS" != success ]; then
            echo "commits-carry ended $CARRY and the commits-shard jobs ended $SHARDS. Repair: open the red job and follow its Repair line." >&2
            exit 1
          fi
          echo "commits-carry and all four commits-shard jobs passed."
  commits-token:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    steps:
      - env:
          AUDIENCE: ${{ github.repository }} commits verdict
        run: |
          curl -sSf --max-time 20 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$(jq -rn --arg a "$AUDIENCE" '$a|@uri')" \
            | jq -r .value > "$RUNNER_TEMP/verdict-token"
      - uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/verdict-token
          key: commits-verdict-${{ github.run_id }}-${{ github.run_attempt }}
  fault-replay-shard:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: bun run fault-replay --shard ${{ matrix.shard }}/4 --tooling-changed-since "$BASE" --update-timings="$RUNNER_TEMP/fault-timings"
      - name: Upload shard timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fault-timings-${{ matrix.shard }}
          path: ${{ runner.temp }}/fault-timings/
  fault-replay:
    if: always() && github.event_name == 'pull_request'
    needs: [test, fault-replay-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          TEST: ${{ needs.test.result }}
          SHARDS: ${{ needs.fault-replay-shard.result }}
        run: |
          if [ "$TEST" != success ] || [ "$SHARDS" != success ]; then
            echo "test ended $TEST and the fault-replay-shard jobs ended $SHARDS. Repair: open the red test or fault-replay-shard job and fix its failure." >&2
            exit 1
          fi
          echo "test and all four fault-replay-shard jobs passed."
