name: CI

on:
  pull_request:

jobs:
  abort-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Core dump settings
        run: |
          cat /proc/sys/kernel/core_pattern
          echo "soft $(ulimit -c) hard $(ulimit -Hc)"
          systemctl is-active apport systemd-coredump.socket 2>&1 || true
          ls -la /var/crash 2>&1 | head -5
      - name: Bun child that calls abort, three each way
        run: |
          for variant in default nocore; do
            for i in 1 2 3; do
              start=$(date +%s%N)
              if [ "$variant" = nocore ]; then (ulimit -c 0; exec bun -e 'process.abort()'); else bun -e 'process.abort()'; fi
              code=$?
              echo "PROBE $variant $i exit $code $(( ($(date +%s%N) - start) / 1000000 )) ms"
            done
          done
          ls -la /var/crash 2>&1 | head -5
      - name: L06s.abort and L06.b, default core limit
        run: bun test tests/kernel/lifecycle/lifecycle.test.ts tests/kernel/state/journal.test.ts -t "L06s.abort|L06.b-abort-then-report" 2>&1 | grep -E "\((pass|fail)\)|^ *[0-9]+ (pass|fail)"
      - name: L06s.abort and L06.b, core limit 0
        run: |
          ulimit -c 0
          bun test tests/kernel/lifecycle/lifecycle.test.ts tests/kernel/state/journal.test.ts -t "L06s.abort|L06.b-abort-then-report" 2>&1 | grep -E "\((pass|fail)\)|^ *[0-9]+ (pass|fail)"
